---
minimum_pre_commit_version: 3.7.1
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-added-large-files
        # The README screenshots are about 920 KB.
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-yaml
      - id: check-symlinks
      - id: detect-private-key
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # direnv file without shebang.
        exclude: ^\.envrc$
  - repo: local
    hooks:
      - id: conky-validate
        name: conky configs compile and their helpers exist
        entry: scripts/check-conky.sh
        language: system
        pass_filenames: false
        files: ^(conky/|scripts/check-conky\.sh$)
